{% macro render_field(field, class='form-control') %}

<div class="mb-3">

    {{ field.label(class="form-label") }}

    {{ field(class=class, **kwargs) }}

    {% if field.errors %}
        <ul class="text-danger mt-2">
            {% for error in field.errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}

</div>

{% endmacro %}
