{% extends 'base.html' %}

{% block content %}

<div class="post-detail">

    <h1>
        {{ post.title }}
    </h1>

    <p class="text-muted">
        Author: {{ post.author }}
    </p>

    <p class="text-muted">
        Category: {{ post.category }}
    </p>

    <p class="text-muted">
        Date: {{ post.posted.strftime('%Y-%m-%d %H:%M') }}
    </p>

    <hr>

    <p>
        {{ post.content }}
    </p>

    <a
        href="{{ url_for('posts.update_post', id=post.id) }}"
        class="btn btn-warning"
    >
        Edit
    </a>

    <a
        href="{{ url_for('posts.delete_post', id=post.id) }}"
        class="btn btn-danger"
    >
        Delete
    </a>

    <a
        href="{{ url_for('posts.all_posts') }}"
        class="btn btn-secondary"
    >
        Back to Posts
    </a>

</div>

{% endblock %}
